<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abrir Activity Launcher</title>
</head>
<body>
<button id="open">Abrir Activity Launcher</button>

<script>
document.getElementById("open").onclick = function () {
    window.location.href =
      "intent://open/#Intent;scheme=activitylauncher;package=com.appstalking.activitylauncher;component=com.appstalking.activitylauncher/.AppTalking_SplashActivity;end";
};
</script>
</body>
</html>
