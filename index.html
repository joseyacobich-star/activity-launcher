<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir Activity Launcher</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            background: #f4f4f4;
        }

        h1 {
            font-size: 28px;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        button {
            font-size: 20px;
            padding: 16px 30px;
            border: none;
            border-radius: 12px;
            background: #111;
            color: white;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        #mensaje {
            margin-top: 20px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <h1>Activity Launcher</h1>

    <p>
        Presioná el botón para abrir Activity Launcher.
    </p>

    <button id="abrir">
        Abrir Activity Launcher
    </button>

    <div id="mensaje"></div>

    <script>
        const intent =
            "intent://open/#Intent;" +
            "action=android.intent.action.MAIN;" +
            "category=android.intent.category.LAUNCHER;" +
            "package=com.appstalking.activitylauncher;" +
            "end";

        document.getElementById("abrir").addEventListener("click", function () {

            document.getElementById("mensaje").textContent =
                "Intentando abrir Activity Launcher...";

            window.location.href = intent;

        });
    </script>

</body>
</html>
