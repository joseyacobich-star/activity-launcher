<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Activity Launcher</title>

    <style>
        body {
            margin: 0;
            padding: 50px 20px;
            background: #f4f4f4;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            color: #555;
            margin-bottom: 30px;
        }

        button {
            background: #111;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px 30px;
            font-size: 20px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

    <h1>Activity Launcher</h1>

    <p>
        Presioná el botón para abrir Activity Launcher.
    </p>

    <a href="intent://com.appstalking.activitylauncher/#Intent;scheme=android-app;end">
        <button>
            Abrir Activity Launcher
        </button>
    </a>

</body>
</html>
